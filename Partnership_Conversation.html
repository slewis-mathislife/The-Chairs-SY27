<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Partnership Conversation  ·  The Chairs Kickoff</title>
<style>
  :root {
    --blue-deep: #0E2A4A;
    --blue-brand: #13B5EA;
    --blue-tint: #E8EFF7;
    --blue-tint-2: #F4F8FB;
    --text-dark: #111111;
    --text-body: #333333;
    --text-muted: #777777;
    --white: #FFFFFF;
    --shadow: 0 4px 20px rgba(14, 42, 74, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Calibri, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--blue-tint-2);
    color: var(--text-body);
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .tag {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--blue-brand);
    font-weight: 700;
    margin-bottom: 6px;
  }
  header h1 {
    font-size: 28px;
    color: var(--blue-deep);
    font-weight: 700;
  }

  /* PROGRESS DOTS */
  .dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .dot {
    width: 36px;
    height: 6px;
    border-radius: 3px;
    background: var(--blue-tint);
    transition: background 0.2s ease;
    cursor: pointer;
  }
  .dot.active { background: var(--blue-brand); }
  .dot.done { background: var(--blue-deep); }

  /* CARD */
  .card {
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 40px 36px;
    border-left: 6px solid var(--blue-brand);
  }

  .card-num {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--blue-brand);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .card-headline {
    font-size: 22px;
    color: var(--blue-brand);
    font-weight: 700;
    margin-bottom: 20px;
  }

  .card-question {
    font-size: 32px;
    color: var(--blue-deep);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 20px;
  }

  .card-framing {
    font-size: 17px;
    font-style: italic;
    color: var(--text-body);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  /* SPARK QUESTIONS */
  .spark-toggle {
    background: transparent;
    border: none;
    color: var(--blue-brand);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    padding: 8px 0;
    text-align: left;
    display: block;
    margin-bottom: 12px;
  }
  .spark-toggle:hover { opacity: 0.7; }
  .spark-toggle .arrow {
    display: inline-block;
    transition: transform 0.2s ease;
  }
  .spark-toggle.open .arrow {
    transform: rotate(90deg);
  }

  .sparks {
    display: none;
    background: var(--blue-tint);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .sparks.open { display: block; }
  .sparks p {
    font-size: 15px;
    color: var(--text-body);
    font-style: italic;
    margin-bottom: 8px;
  }
  .sparks p:last-child { margin-bottom: 0; }
  .sparks p:before {
    content: "•  ";
    color: var(--blue-brand);
    font-style: normal;
    font-weight: 700;
  }

  /* OPTIONAL NOTES */
  .notes-section {
    border-top: 1px solid var(--blue-tint);
    padding-top: 24px;
    margin-top: 8px;
  }

  .notes-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .notes-label {
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
  }

  .saved-indicator {
    font-size: 12px;
    color: var(--blue-brand);
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .saved-indicator.show { opacity: 1; }
  .saved-indicator.idle { opacity: 0.5; color: var(--text-muted); }

  .notes-help {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    padding: 12px 14px;
    border: 1.5px solid var(--blue-tint);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-dark);
    resize: vertical;
    transition: border-color 0.2s ease;
  }
  textarea:focus {
    outline: none;
    border-color: var(--blue-brand);
  }

  /* CARD 5 EMPHASIS */
  .card.commit {
    border-left-color: var(--blue-deep);
    background: linear-gradient(180deg, var(--white) 0%, #FCFDFE 100%);
  }
  .card.commit .card-question { color: var(--blue-deep); }
  .card.commit .notes-section {
    background: var(--blue-tint);
    margin: 16px -36px -40px;
    padding: 24px 36px 32px;
    border-radius: 0 0 16px 0;
  }
  .card.commit .notes-label {
    color: var(--blue-deep);
    letter-spacing: 2px;
  }
  .card.commit textarea {
    background: var(--white);
    border-color: var(--blue-deep);
    min-height: 100px;
  }

  /* NAVIGATION */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s ease;
    border: 1.5px solid transparent;
  }

  .btn-primary {
    background: var(--blue-brand);
    color: var(--white);
    border-color: var(--blue-brand);
  }
  .btn-primary:hover {
    background: var(--blue-deep);
    border-color: var(--blue-deep);
  }

  .btn-ghost {
    background: transparent;
    color: var(--blue-brand);
    border-color: var(--blue-brand);
  }
  .btn-ghost:hover {
    background: var(--blue-brand);
    color: var(--white);
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* RESUME DIALOG */
  .resume-card {
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 36px;
    border-top: 6px solid var(--blue-brand);
    text-align: center;
  }
  .resume-card h2 {
    font-size: 26px;
    color: var(--blue-deep);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .resume-card p {
    font-size: 16px;
    color: var(--text-body);
    margin-bottom: 24px;
  }
  .resume-card .timestamp {
    display: inline-block;
    background: var(--blue-tint);
    color: var(--blue-deep);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .resume-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* SUMMARY */
  .summary .card-question { font-size: 28px; }
  .summary-section {
    background: var(--blue-tint-2);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    border-left: 3px solid var(--blue-brand);
  }
  .summary-section.commit {
    border-left-color: var(--blue-deep);
    background: var(--blue-tint);
    padding: 22px;
  }
  .summary-section h3 {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--blue-brand);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .summary-section.commit h3 {
    color: var(--blue-deep);
    font-size: 14px;
  }
  .summary-section .q {
    font-size: 16px;
    color: var(--text-dark);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .summary-section.commit .q { font-size: 18px; }
  .summary-section .a {
    font-size: 15px;
    color: var(--text-body);
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .summary-section .a.empty {
    font-style: italic;
    color: var(--text-muted);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }
  .actions .btn { flex: 1; min-width: 140px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--blue-deep);
    color: var(--white);
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 12px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="tag">THE CHAIRS KICKOFF  ·  DC + API PARTNER TIME</div>
    <h1>Partnership Conversation</h1>
  </header>

  <div class="dots" id="dots"></div>
  <div id="cardArea"></div>
  <div class="nav" id="nav"></div>
</div>

<div class="toast" id="toast"></div>
<footer>Newark Collegiate  ·  SY27</footer>

<script>
const STORAGE_KEY = "collegiate_partnership_v1";

const PROMPTS = [
  {
    num: "01",
    headline: "Hopes",
    question: "What is your hope for the department in SY27?",
    framing: "Name the future you want to build. Don't worry about whether it's realistic. Hopes come first.",
    spark: [
      "What would make you proud to walk into your department in May 2027?",
      "What do you want students to say about a class in this department?",
      "What do you want teachers in this department to say about being on this team?",
    ],
  },
  {
    num: "02",
    headline: "Bright spots",
    question: "What is one bright spot from this year that you want to amplify?",
    framing: "Something that worked. Something we should keep doing on purpose instead of by accident.",
    spark: [
      "When did you see real student thinking happening this year?",
      "When did the team show up for each other in a way that felt good?",
      "What's one moment from this year you don't want to lose?",
    ],
  },
  {
    num: "03",
    headline: "Growing edges",
    question: "What is one growing edge you want to work on together?",
    framing: "Where you want to stretch. Where the work is hardest. Where partnership will matter most.",
    spark: [
      "What's a recurring problem in the department you haven't cracked yet?",
      "What's one move you've been wanting to make but haven't?",
      "Where do you need a coach this year?",
    ],
  },
  {
    num: "04",
    headline: "Asks",
    question: "What do you need from each other to make next year great?",
    framing: "Be specific. The partnership is built in concrete asks, not vague vibes. Both of you answer.",
    spark: [
      "What does great coaching from your API look like to you?",
      "What does great content leadership from your DC look like to you?",
      "What's one thing you'd ask your partner to start, stop, or keep doing?",
    ],
  },
  {
    num: "05",
    headline: "First move",
    question: "What is one specific action you'll take together in the next two weeks?",
    framing: "Make it real. Pick something small enough you can actually do it. Name who, what, and when.",
    spark: [
      "Could we look at last semester's data together?",
      "Could we co-plan one CTM for the fall?",
      "Could we set up a recurring 30-min summer check-in?",
    ],
    commit: true,
  },
];

let currentIdx = 0;
let notes = PROMPTS.map(() => "");
let sparksOpen = PROMPTS.map(() => false);
let isComplete = false;
let mode = "loading"; // "loading" | "resume-prompt" | "active" | "complete"

// ============================================================
// STORAGE (browser localStorage)
// ============================================================
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    // Validate shape
    if (!Array.isArray(data.notes) || data.notes.length !== PROMPTS.length) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function saveState() {
  try {
    const data = {
      notes: notes,
      currentIdx: currentIdx,
      timestamp: new Date().toISOString(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
}

function hasMeaningfulNotes(notesArr) {
  return notesArr.some(n => n && n.trim().length > 0);
}

function formatTimestamp(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("en-US", {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  } catch (e) {
    return "earlier";
  }
}

// ============================================================
// RENDERING
// ============================================================
function render() {
  if (mode === "resume-prompt") {
    renderResumePrompt();
    document.getElementById("dots").style.display = "none";
    document.getElementById("nav").innerHTML = "";
    return;
  }

  document.getElementById("dots").style.display = "flex";
  renderDots();

  if (isComplete) {
    renderSummary();
    renderEndNav();
  } else {
    renderCard();
    renderNav();
  }
}

function renderResumePrompt() {
  const saved = loadState();
  const ts = saved ? formatTimestamp(saved.timestamp) : "";
  document.getElementById("cardArea").innerHTML = `
    <div class="resume-card">
      <div class="timestamp">SAVED ${ts.toUpperCase()}</div>
      <h2>Welcome back.</h2>
      <p>You have a partnership conversation in progress. Pick up where you left off, or start fresh?</p>
      <div class="resume-actions">
        <button class="btn btn-primary" onclick="resumeSaved()">RESUME</button>
        <button class="btn btn-ghost" onclick="startFresh()">START FRESH</button>
      </div>
    </div>
  `;
}

function renderDots() {
  const el = document.getElementById("dots");
  el.innerHTML = "";
  PROMPTS.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot";
    if (isComplete) {
      d.classList.add("done");
    } else if (i === currentIdx) {
      d.classList.add("active");
    } else if (i < currentIdx) {
      d.classList.add("done");
    }
    d.onclick = () => {
      if (isComplete) return;
      saveNote();
      currentIdx = i;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    el.appendChild(d);
  });
}

function renderCard() {
  const p = PROMPTS[currentIdx];
  const el = document.getElementById("cardArea");
  const isOpen = sparksOpen[currentIdx];
  const isCommit = p.commit;
  const hasNote = notes[currentIdx] && notes[currentIdx].trim().length > 0;

  el.innerHTML = `
    <div class="card ${isCommit ? 'commit' : ''}">
      <div class="card-num">CARD ${p.num}  /  05</div>
      <div class="card-headline">${p.headline}</div>
      <div class="card-question">${escapeHtml(p.question)}</div>
      <div class="card-framing">${escapeHtml(p.framing)}</div>

      <button class="spark-toggle ${isOpen ? 'open' : ''}" onclick="toggleSparks()">
        <span class="arrow">▶</span>  ${isOpen ? 'HIDE' : 'NEED A WAY IN?'}
      </button>
      <div class="sparks ${isOpen ? 'open' : ''}">
        ${p.spark.map(s => `<p>${escapeHtml(s)}</p>`).join("")}
      </div>

      <div class="notes-section">
        <div class="notes-header">
          <div class="notes-label">${isCommit ? 'YOUR FIRST MOVE' : 'NOTES (optional)'}</div>
          <div class="saved-indicator ${hasNote ? 'idle' : ''}" id="savedIndicator">${hasNote ? 'AUTO-SAVED' : ''}</div>
        </div>
        <div class="notes-help">${isCommit ? 'Write the commitment so you both have it.' : 'Type if you want. This is for you, not a worksheet.'}</div>
        <textarea
          id="notes-${currentIdx}"
          placeholder="${isCommit ? 'Who, what, when...' : ''}"
          oninput="onNoteInput()"
        >${escapeHtml(notes[currentIdx])}</textarea>
      </div>
    </div>
  `;
}

function renderNav() {
  const el = document.getElementById("nav");
  const isLast = currentIdx === PROMPTS.length - 1;
  el.innerHTML = `
    <button class="btn btn-ghost" onclick="prev()" ${currentIdx === 0 ? 'disabled' : ''}>← BACK</button>
    <button class="btn btn-primary" onclick="next()">${isLast ? 'WRAP UP →' : 'NEXT PROMPT →'}</button>
  `;
}

function renderSummary() {
  const el = document.getElementById("cardArea");
  const sections = PROMPTS.map((p, i) => {
    const note = notes[i].trim();
    const isCommit = p.commit;
    return `
      <div class="summary-section ${isCommit ? 'commit' : ''}">
        <h3>${isCommit ? 'YOUR FIRST MOVE' : 'CARD ' + p.num + '  ·  ' + p.headline.toUpperCase()}</h3>
        <div class="q">${escapeHtml(p.question)}</div>
        <div class="a ${note ? '' : 'empty'}">${note ? escapeHtml(note) : '(no notes captured)'}</div>
      </div>
    `;
  }).reverse().join("");

  el.innerHTML = `
    <div class="card summary">
      <div class="card-num">YOUR PARTNERSHIP NOTES</div>
      <div class="card-question">Save what surfaced.</div>
      <div class="card-framing">Card 5 is at the top. That's the commitment. Send it to yourselves so you actually do it.</div>
      ${sections}
      <div class="actions">
        <button class="btn btn-primary" onclick="copyAll()">COPY TO CLIPBOARD</button>
        <button class="btn btn-ghost" onclick="emailAll()">EMAIL TO YOURSELF</button>
        <button class="btn btn-ghost" onclick="downloadText()">DOWNLOAD AS TEXT</button>
      </div>
    </div>
  `;
}

function renderEndNav() {
  const el = document.getElementById("nav");
  el.innerHTML = `
    <button class="btn btn-ghost" onclick="backToConversation()">← BACK TO PROMPTS</button>
    <button class="btn btn-ghost" onclick="resetAll()">START OVER</button>
  `;
}

// ============================================================
// INTERACTIONS
// ============================================================
function toggleSparks() {
  sparksOpen[currentIdx] = !sparksOpen[currentIdx];
  render();
}

// Debounced auto-save + indicator
let saveTimer = null;
function onNoteInput() {
  const ta = document.getElementById("notes-" + currentIdx);
  if (!ta) return;
  notes[currentIdx] = ta.value;

  // Show saving indicator immediately, then "auto-saved" after debounce
  const ind = document.getElementById("savedIndicator");
  if (ind) {
    ind.textContent = "SAVING...";
    ind.classList.remove("idle");
    ind.classList.add("show");
  }

  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveState();
    if (ind) {
      ind.textContent = "AUTO-SAVED";
      // Fade to idle state after a moment
      setTimeout(() => {
        if (ind) ind.classList.add("idle");
      }, 1200);
    }
  }, 350);
}

function saveNote() {
  // Capture current textarea (in case user clicks nav before debounce fires)
  const ta = document.getElementById("notes-" + currentIdx);
  if (ta) notes[currentIdx] = ta.value;
  saveState();
}

function prev() {
  saveNote();
  if (currentIdx > 0) {
    currentIdx--;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function next() {
  saveNote();
  if (currentIdx < PROMPTS.length - 1) {
    currentIdx++;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    isComplete = true;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function backToConversation() {
  isComplete = false;
  render();
}

function resetAll() {
  if (confirm("Clear all notes and start over? This cannot be undone.")) {
    clearState();
    notes = PROMPTS.map(() => "");
    sparksOpen = PROMPTS.map(() => false);
    currentIdx = 0;
    isComplete = false;
    render();
  }
}

function resumeSaved() {
  const saved = loadState();
  if (saved) {
    notes = saved.notes;
    currentIdx = typeof saved.currentIdx === "number" ? saved.currentIdx : 0;
    // If they saved while complete, reset to the last card so they can re-review
    if (currentIdx >= PROMPTS.length) currentIdx = PROMPTS.length - 1;
  }
  mode = "active";
  render();
}

function startFresh() {
  clearState();
  notes = PROMPTS.map(() => "");
  sparksOpen = PROMPTS.map(() => false);
  currentIdx = 0;
  isComplete = false;
  mode = "active";
  render();
}

// ============================================================
// EXPORT
// ============================================================
function buildExportText() {
  const date = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  let text = `PARTNERSHIP CONVERSATION  ·  ${date}\n`;
  text += `The Chairs Kickoff  ·  Newark Collegiate  ·  SY27\n`;
  text += `${"=".repeat(60)}\n\n`;

  const firstMove = notes[4].trim();
  text += `*** YOUR FIRST MOVE ***\n\n`;
  text += `${PROMPTS[4].question}\n\n`;
  text += `${firstMove || "(no commitment captured)"}\n\n`;
  text += `${"=".repeat(60)}\n\n`;

  PROMPTS.slice(0, 4).forEach((p, i) => {
    text += `CARD ${p.num}  ·  ${p.headline.toUpperCase()}\n`;
    text += `${p.question}\n\n`;
    text += `${notes[i].trim() || "(no notes captured)"}\n\n`;
    text += `${"-".repeat(40)}\n\n`;
  });

  return text;
}

function copyAll() {
  const text = buildExportText();
  navigator.clipboard.writeText(text).then(
    () => showToast("Copied to clipboard"),
    () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast("Copied to clipboard"); }
      catch (e) { showToast("Copy failed - try Download"); }
      document.body.removeChild(ta);
    }
  );
}

function emailAll() {
  const subject = encodeURIComponent("Partnership Conversation Notes  ·  SY27");
  const body = encodeURIComponent(buildExportText());
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

function downloadText() {
  const text = buildExportText();
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "partnership-conversation.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Downloaded");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function escapeHtml(str) {
  if (typeof str !== "string") return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ============================================================
// INIT
// ============================================================
function init() {
  const saved = loadState();
  if (saved && hasMeaningfulNotes(saved.notes)) {
    // Offer resume
    mode = "resume-prompt";
    render();
  } else {
    mode = "active";
    render();
  }
}

init();
</script>
